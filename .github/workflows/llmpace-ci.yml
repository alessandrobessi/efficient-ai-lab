name: llmpace CI

on:
  push:
    branches: [main]
    paths:
      - "projects/llmpace/**"
      - ".github/workflows/llmpace-ci.yml"
  pull_request:
    paths:
      - "projects/llmpace/**"
      - ".github/workflows/llmpace-ci.yml"

defaults:
  run:
    working-directory: projects/llmpace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false # llmpace has zero external dependencies (stdlib only) -- no go.sum to key a cache on
      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -race -v
