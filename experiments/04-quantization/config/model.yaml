# Same base model as Weeks 2-3, across 6 quantization levels: the F16 GGUF already
# downloaded in Week 2 (unquantized ceiling reference) plus 5 quantized formats
# matching FULL-ROADMAP.md's suggested "Q8, Q6, Q5, Q4, Q3" (using the _K variants).
llama_cli_bin: "vendor/llama.cpp/build/bin/llama-cli"

quant_levels:
  - name: F16
    file: "models/gguf/qwen2.5-1.5b-instruct-fp16.gguf"
  - name: Q8_0
    file: "models/gguf/qwen2.5-1.5b-instruct-q8_0.gguf"
  - name: Q6_K
    file: "models/gguf/qwen2.5-1.5b-instruct-q6_k.gguf"
  - name: Q5_K_M
    file: "models/gguf/qwen2.5-1.5b-instruct-q5_k_m.gguf"
  - name: Q4_K_M
    file: "models/gguf/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  - name: Q3_K_M
    file: "models/gguf/qwen2.5-1.5b-instruct-q3_k_m.gguf"

# Same prompt as Weeks 1-3, for continuity.
prompt: >
  Explain, in a few sentences, why running a language model on a CPU has
  different performance characteristics from running it on a GPU.

# Week 2/3's throughput-optimal thread count on this machine (4 performance cores).
threads: 2

experiment_4:
  max_new_tokens: 64
  repetitions: 10
