[project]
name = "efficient-ai-lab"
version = "0.1.0"
description = "Efficient AI Systems — a 12-week CPU-first Small Language Model research program"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.24",
]

[tool.uv]
package = false
